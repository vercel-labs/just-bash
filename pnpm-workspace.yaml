packages:
  - packages/*
  - examples/*

# Packages whose install scripts we allow to run. pnpm 10 blocks install
# scripts by default; this is the explicit allowlist for build-time native
# bindings (zstd/liblzma) and the bundlers that need a per-platform binary.
onlyBuiltDependencies:
  - "@mongodb-js/zstd"
  - esbuild
  - node-liblzma
  - sharp
  - unrs-resolver

# guarded-fetch is a Vercel-published dependency tracked at an exact version.
# It bypasses the global min-release-age gate so a freshly published patch can
# be adopted without waiting out the cool-off window.
minimumReleaseAgeExclude:
  - guarded-fetch
