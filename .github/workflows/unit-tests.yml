name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install XZ build dependency
        run: sudo apt-get update && sudo apt-get install --yes liblzma-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run unit tests
        env:
          TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/test-diagnostics
        run: pnpm test:unit

      - name: Upload test crash diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics-node-${{ matrix.node-version }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-diagnostics
          retention-days: 7
          if-no-files-found: warn

      - name: Run dist tests
        run: pnpm test:dist
